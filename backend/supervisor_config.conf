# ============================================================================
# SUPERVISOR Configuration for Batch Log Processor
# File: /etc/supervisor/conf.d/app_logs_processor.conf
# 
# Purpose: Run process_logs_batch.php continuously to process queued logs
# 
# Installation:
# 1. Copy this file to: /etc/supervisor/conf.d/app_logs_processor.conf
# 2. Run: sudo supervisorctl reread && sudo supervisorctl update
# 3. Start: sudo supervisorctl start app_logs_processor
# ============================================================================

[program:app_logs_processor]

# Full path to PHP script
command=/usr/bin/php /var/www/html/backend/process_logs_batch.php

# Run under this user
user=www-data

# Automatically restart if crashed
autostart=true
autorestart=true

# Number of processes (run 4 parallel workers to handle 4000+ logs/sec)
numprocs=4
process_name=%(program_name)s_%(process_num)02d

# Standard output log
stdout_logfile=/var/log/supervisor/%(program_name)s_%(process_num)02d.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5

# Error log
stderr_logfile=/var/log/supervisor/%(program_name)s_%(process_num)02d_err.log
stderr_logfile_maxbytes=100MB
stderr_logfile_backups=5

# Restart after processing 1000 batches (prevents memory leaks)
startsecs=10
stopwaitsecs=10

# Priority (higher = earlier start/later stop)
priority=999

# Events that supervisor listens to
events=PROCESS_STATE
buffer_size=100

# Environment variables
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",HOME="/var/www"

# ============================================================================
# CRON Configuration (Alternative: Run every 5 seconds)
# File: /etc/cron.d/app_logs_batch
# ============================================================================

# Run batch processor every 5 seconds
# This is less efficient than supervisor but simpler for smaller deployments

# */5 * * * * /usr/bin/php /var/www/html/backend/process_logs_batch.php >> /var/log/app_logs_processor_cron.log 2>&1

# ============================================================================
# MONITORING COMMANDS
# ============================================================================

# Check supervisor status:
# sudo supervisorctl status

# View logs:
# tail -f /var/log/supervisor/app_logs_processor_*.log

# Restart specific process:
# sudo supervisorctl restart app_logs_processor:app_logs_processor_00

# Stop all:
# sudo supervisorctl stop app_logs_processor:*

# Start all:
# sudo supervisorctl start app_logs_processor:*

# ============================================================================
